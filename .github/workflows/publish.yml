# Publishes the notes site, with a view-only copy of your highlights and chapter notes for browsers that
# have no token (your office laptop). The copy is public, like the rest of the site.
#   - on every change to main (new notes): publish the site
#   - about every 15 minutes: publish again only if your highlights or chapter notes changed
#   - "Run workflow" on GitHub (Actions tab): copy now
# Needs: the secret HIGHLIGHTS_TOKEN (read-only token for MyNotes-highlights), and
# Settings -> Pages -> Source set to "GitHub Actions". Until then each run just stops early.
name: Publish site and highlights

on:
  push:
    branches: [main]
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.decide.outputs.deploy }}
    steps:
      - name: Check that Pages publishes from GitHub Actions
        id: mode
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if out=$(gh api "repos/${{ github.repository }}/pages" 2>&1); then
            t=$(printf '%s' "$out" | jq -r '.build_type // "unknown"')
          else
            t=unreadable
            echo "::warning::Could not read the Pages settings, so trying to publish anyway: $(printf '%s' "$out" | head -c 300)"
          fi
          echo "Pages build type: $t"
          echo "build_type=$t" >> "$GITHUB_OUTPUT"
          if [ "$t" = "legacy" ]; then
            echo "::notice::Pages still publishes from a branch, so this run stops here. Switch Settings -> Pages -> Source to GitHub Actions."
          fi
      - uses: actions/checkout@v5
        if: steps.mode.outputs.build_type != 'legacy'
      - name: Copy highlights and chapter notes
        id: copy
        if: steps.mode.outputs.build_type != 'legacy'
        env:
          HIGHLIGHTS_TOKEN: ${{ secrets.HIGHLIGHTS_TOKEN }}
        run: python3 .github/scripts/public_highlights.py
      - name: Decide whether to publish
        id: decide
        if: steps.mode.outputs.build_type != 'legacy'
        run: |
          if [ "${{ github.event_name }}" != "schedule" ] || [ "${{ steps.copy.outputs.changed }}" = "true" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"; echo "No new highlights or notes, nothing to publish."
          fi
      - uses: actions/configure-pages@v5
        if: steps.decide.outputs.deploy == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.decide.outputs.deploy == 'true'
        with:
          path: .

  deploy:
    needs: build
    if: needs.build.outputs.deploy == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
