<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Study Notes Library</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lexend:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Layout idea: three columns like a docs site. Books on top, chapters left, page outline right. */
:root{
  --bg:#fbfbf9; --surface:#ffffff; --ink:#1c2430; --muted:#5d6877; --line:#e3e6ea;
  --accent:#0b6b8a; --accent-soft:#e1f1f6; --code-bg:#f3f5f7; --warn:#8a5a00; --warn-soft:#fdf3dc;
  --font-display:'Lexend',system-ui,sans-serif; --font-body:'Inter',system-ui,sans-serif; --font-mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1419; --surface:#161c24; --ink:#e4e9ef; --muted:#9aa6b4; --line:#273140;
    --accent:#5cc0de; --accent-soft:#16303a; --code-bg:#1b232d; --warn:#f0c26a; --warn-soft:#2e2511; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1419; --surface:#161c24; --ink:#e4e9ef; --muted:#9aa6b4; --line:#273140;
  --accent:#5cc0de; --accent-soft:#16303a; --code-bg:#1b232d; --warn:#f0c26a; --warn-soft:#2e2511; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:18px;line-height:1.7;display:flex;flex-direction:column}
a{color:var(--accent)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
header{display:flex;align-items:center;gap:16px;padding:10px 20px;border-bottom:1px solid var(--line);background:var(--surface);flex:none}
.brand{font-family:var(--font-display);font-weight:700;font-size:19px;white-space:nowrap}
.books{display:flex;gap:4px;flex:1;overflow-x:auto}
.books button{border:0;background:none;padding:7px 14px;border-radius:8px;cursor:pointer;font-weight:500;color:var(--muted);white-space:nowrap}
.books button:hover{background:var(--accent-soft);color:var(--ink)}
.books button[aria-current="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.icon-btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 12px;cursor:pointer;font-weight:500}
.icon-btn:hover{border-color:var(--accent)}
#chbtn{display:flex;align-items:center;gap:8px;max-width:340px;min-width:0}
#chbtn .lbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600;color:var(--accent)}
#chbtn .car{transition:transform .15s;flex:none}
#chbtn[aria-expanded="true"] .car{transform:rotate(180deg)}
#chmenu{position:fixed;z-index:20;top:56px;right:16px;width:min(380px,calc(100vw - 24px));max-height:calc(100vh - 72px);overflow-y:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px;box-shadow:0 12px 32px rgba(0,0,0,.22)}
#chmenu[hidden]{display:none}
#chmenu a{display:block;padding:8px 10px;border-radius:8px;color:var(--ink);text-decoration:none;font-size:15px;line-height:1.35;margin-bottom:2px}
#chmenu a:hover{background:var(--accent-soft)}
#chmenu a[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
#chmenu a.draft{color:var(--muted)}
#chmenu .tag{font-size:11px;border:1px solid var(--line);border-radius:999px;padding:0 7px;margin-left:6px;color:var(--muted)}
.shell{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 230px}
aside.right{overflow-y:auto;padding:22px 16px}
aside.right{border-left:1px solid var(--line)}
.nav-title{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 10px 8px;font-weight:600}
aside.right ul{list-style:none;margin:0;padding:0;border-left:1px solid var(--line)}
aside.right a{display:block;padding:4px 12px;color:var(--muted);text-decoration:none;font-size:14px;line-height:1.4;margin-left:-1px;border-left:2px solid transparent}
aside.right a.h3{padding-left:26px}
aside.right a:hover{color:var(--ink)}
aside.right a.on{color:var(--accent);border-left-color:var(--accent);font-weight:600}
main{overflow-y:auto;scroll-behavior:smooth}
article{max-width:860px;margin:0 auto;padding:36px 32px 60px}
article h1{font-family:var(--font-display);font-size:2.2rem;line-height:1.2;margin:0 0 .6em;text-wrap:balance}
article h2{font-family:var(--font-display);font-size:1.5rem;margin:2.1em 0 .5em;padding-top:.4em;border-top:1px solid var(--line);text-wrap:balance}
article h3{font-family:var(--font-display);font-size:1.2rem;margin:1.7em 0 .4em}
article p,article li{max-width:68ch}
article em{color:var(--muted)}
article code{font-family:var(--font-mono);font-size:.86em;background:var(--code-bg);padding:.1em .38em;border-radius:5px}
article h1 code,article h2 code,article h3 code{font-size:.8em;background:none;padding:0}
article pre{background:var(--code-bg);border:1px solid var(--line);border-radius:10px;padding:14px 16px;overflow-x:auto;line-height:1.5}
article pre code{background:none;padding:0;font-size:.84rem}
.tbl{overflow-x:auto;margin:1.2em 0}
article table{border-collapse:collapse;font-size:.95rem;min-width:60%}
article th,article td{border:1px solid var(--line);padding:8px 12px;text-align:left;vertical-align:top}
article th{background:var(--code-bg)}
article blockquote{margin:1em 0;padding:.1em 1em;border-left:3px solid var(--accent);color:var(--muted)}
article hr{border:0;border-top:1px solid var(--line);margin:2em 0}
.draftbox{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:12px 16px;margin:1.2em 0}
.mtoc{display:none;border:1px solid var(--line);border-radius:10px;background:var(--surface);margin:0 0 1.4rem;padding:2px 14px;font-size:15px}.mtoc summary{cursor:pointer;padding:10px 0;font-weight:600}.mtoc ul{list-style:none;margin:0 0 10px;padding:0}.mtoc a{display:block;padding:6px 0;text-decoration:none;color:var(--ink)}.mtoc a.h3{padding-left:16px;color:var(--muted)}
.pager{display:flex;justify-content:space-between;gap:12px;margin-top:3rem;flex-wrap:wrap}
.pager a{border:1px solid var(--line);border-radius:10px;padding:10px 16px;text-decoration:none;color:var(--ink);background:var(--surface)}
.pager a:hover{border-color:var(--accent)}
.pager small{display:block;color:var(--muted)}
.hljs-keyword,.hljs-built_in,.hljs-literal{color:var(--accent);font-weight:500}
.hljs-string{color:#2f8a4f}.hljs-comment{color:var(--muted);font-style:italic}.hljs-number{color:#b5532c}
.hljs-title{color:#7a4fb5}.hljs-meta{color:var(--warn)}
:root[data-theme="dark"] .hljs-string{color:#8fd19e}:root[data-theme="dark"] .hljs-number{color:#f0a37f}:root[data-theme="dark"] .hljs-title{color:#c4a4f0}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .hljs-string{color:#8fd19e}:root:not([data-theme="light"]) .hljs-number{color:#f0a37f}:root:not([data-theme="light"]) .hljs-title{color:#c4a4f0}}
/* Callouts (GitHub alert syntax: > [!NOTE] etc.) */
.callout{border:1px solid var(--line);border-left:4px solid var(--c);background:var(--cs);border-radius:10px;padding:10px 16px 6px;margin:1.3em 0}
.callout .ctitle{font-weight:600;color:var(--c);margin:0 0 4px;font-size:.95rem;letter-spacing:.01em}
.callout p,.callout li{max-width:none}
.callout ul{padding-left:1.15em;margin:.3em 0}
.callout>*:last-child{margin-bottom:6px}
.callout.note{--c:#2563eb;--cs:#eef4ff}.callout.tip{--c:#15803d;--cs:#ecfaf0}.callout.important{--c:#7c3aed;--cs:#f4efff}
.callout.warning{--c:#b45309;--cs:#fff6e6}.callout.caution{--c:#c0262d;--cs:#fdeeee}
:root[data-theme="dark"] .callout.note{--c:#7aa7ff;--cs:#16223a}:root[data-theme="dark"] .callout.tip{--c:#5fd38a;--cs:#12261a}:root[data-theme="dark"] .callout.important{--c:#b896ff;--cs:#221a35}:root[data-theme="dark"] .callout.warning{--c:#f0b45c;--cs:#2c2111}:root[data-theme="dark"] .callout.caution{--c:#ff8a8f;--cs:#2e1517}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .callout.note{--c:#7aa7ff;--cs:#16223a}:root:not([data-theme="light"]) .callout.tip{--c:#5fd38a;--cs:#12261a}:root:not([data-theme="light"]) .callout.important{--c:#b896ff;--cs:#221a35}:root:not([data-theme="light"]) .callout.warning{--c:#f0b45c;--cs:#2c2111}:root:not([data-theme="light"]) .callout.caution{--c:#ff8a8f;--cs:#2e1517}}
/* Diagrams */
.mermaid{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;margin:1.3em 0;text-align:center;overflow-x:auto}
/* Collapsible interview answers */
article details.qa{border:1px solid var(--line);border-radius:10px;margin:.7em 0;background:var(--surface)}
article details.qa>summary{cursor:pointer;padding:10px 14px;font-weight:600;list-style:none}
article details.qa>summary::-webkit-details-marker{display:none}
article details.qa>summary::before{content:"▸";display:inline-block;width:1.2em;color:var(--accent)}
article details.qa[open]>summary::before{content:"▾"}
article details.qa>*:not(summary){margin-left:14px;margin-right:14px}
article details.qa>ul,article details.qa>p{margin-top:0}
/* Level badges in tables */
article table td:first-child strong{white-space:nowrap}
@media (max-width:1100px){.shell{grid-template-columns:minmax(0,1fr)}aside.right{display:none}.mtoc{display:block}}
@media (max-width:760px){
  .brand{display:none}
  header{padding:8px 12px;gap:8px;flex-wrap:wrap}
  .books{order:3;flex:1 1 100%;flex-wrap:wrap;gap:2px}
  .books button{padding:6px 10px}
  #chbtn{flex:1 1 0;max-width:none}
  #chmenu{top:104px;right:12px;left:12px;width:auto;max-height:calc(100vh - 120px)}
  body{font-size:18.5px;line-height:1.72}
  article h1{font-size:1.8rem}
  article h2{font-size:1.4rem}
  article h3{font-size:1.18rem}
  article pre code{font-size:.8rem}
  article table{font-size:.9rem}
  .callout{padding:10px 12px 4px}
  article{padding:24px 18px 48px}
}
@media (prefers-reduced-motion:reduce){main{scroll-behavior:auto}#chbtn .car{transition:none}}
</style>
</head>
<body>
<header>
  
  <div class="brand">Study Notes</div>
  <div class="books" id="books" role="tablist" aria-label="Books"></div>
  <button id="chbtn" class="icon-btn" aria-haspopup="true" aria-expanded="false" aria-controls="chmenu"><svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true" style="flex:none"><path d="M3 5h14M3 10h14M3 15h14"/></svg><span class="lbl" id="chlbl">Chapters</span><svg class="car" width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M2 4l4 4 4-4"/></svg></button>
  <button id="theme" class="icon-btn" aria-label="Switch colour theme">Dark</button>
</header>
<div id="chmenu" role="menu" aria-label="Chapters" hidden></div>
<div class="shell">
  <main id="main"><article id="doc"></article></main>
  <aside class="right" id="right" aria-label="On this page"></aside>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
<script>
var BOOKS = [
  {slug:'python',title:'Python'},{slug:'pydantic',title:'Pydantic'},{slug:'llm',title:'LLM'},
  {slug:'langchain',title:'Langchain'},{slug:'mcp',title:'MCP'},{slug:'projects',title:'Projects'}
];
var root = document.documentElement;
var state = {book: BOOKS[0].slug, ch: null};
var token = 0;

function esc(s){return s.replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function bookOf(slug){return BOOKS.filter(function(b){return b.slug===slug})[0]}
function hashFor(b,c){return b+'-'+c}
function firstWritten(b){var cs=b.chapters||[];for(var i=0;i<cs.length;i++) if(cs[i].written) return cs[i].id; return null}
function getText(url){return fetch(url,{cache:'no-cache'}).then(function(r){return r.ok?r.text():''}).catch(function(){return ''})}

function loadBook(b){
  if(b.loading) return b.loading;
  b.loading=getText('books/'+b.slug+'/SUMMARY.md').then(function(summ){
    var chs=[],re=/\* \[(.+?)\]\((.+?)\)/g,m;
    while((m=re.exec(summ))){ if(m[2]==='README.md')continue; chs.push({id:m[2].replace(/\.md$/,''),title:m[1],file:m[2],md:'',written:false}); }
    b.chapters=chs;
    return Promise.all(chs.map(function(c){return getText('books/'+b.slug+'/'+c.file).then(function(md){c.md=md;c.written=!!md&&md.indexOf('_Not written yet._')<0;});}));
  }).then(function(){return getText('books/'+b.slug+'/README.md')}).then(function(intro){b.intro=intro;return b});
  return b.loading;
}
function parseHash(){
  var h=location.hash.replace('#','');
  for(var i=0;i<BOOKS.length;i++){
    var b=BOOKS[i];
    if(h===b.slug) return {book:b.slug,ch:undefined};
    if(h.indexOf(b.slug+'-')===0) return {book:b.slug,ch:h.slice(b.slug.length+1)};
  }
  return {book:BOOKS[0].slug,ch:undefined};
}
function renderBooks(){
  document.getElementById('books').innerHTML=BOOKS.map(function(b){
    return '<button role="tab" data-book="'+b.slug+'" aria-current="'+(b.slug===state.book)+'">'+esc(b.title)+'</button>';
  }).join('');
}
function renderLeft(b){
  var h='<p class="nav-title">'+esc(b.title)+'</p>', cur=null;
  (b.chapters||[]).forEach(function(c,i){
    if(c.id===state.ch) cur=(i+1)+'. '+c.title;
    h+='<a href="#'+hashFor(b.slug,c.id)+'" class="'+(c.written?'':'draft')+'"'+(c.id===state.ch?' aria-current="page"':'')+'>'+(i+1)+'. '+esc(c.title)+(c.written?'':'<span class="tag">soon</span>')+'</a>';
  });
  document.getElementById('chmenu').innerHTML=h;
  document.getElementById('chlbl').textContent=cur||(b.title+' chapters');
}
function fixLinks(html){
  return html.replace(/href="(?:\.\.\/([a-z]+)\/)?([0-9]{2}-[^"#]+)\.md"/g,function(m,bk,id){
    return 'href="#'+hashFor(bk||state.book,id)+'"';
  });
}
function show(){
  var p=parseHash(), my=++token; state.book=p.book; renderBooks();
  var b=bookOf(p.book), doc=document.getElementById('doc');
  if(!b.chapters){ doc.innerHTML='<p>Loading '+esc(b.title)+'...</p>'; document.getElementById('chmenu').innerHTML=''; document.getElementById('right').innerHTML=''; }
  loadBook(b).then(function(){
    if(my!==token) return;
    var id=p.ch; if(id===undefined) id=firstWritten(b);
    state.ch=id;
    var c=null; b.chapters.forEach(function(x){if(x.id===id)c=x});
    renderLeft(b);
    var html;
    if(!c){ html=marked.parse(b.intro||('# '+b.title))+'<div class="draftbox">No chapter has been written in this book yet. They appear here as each batch is processed.</div>'; }
    else if(!c.written){ html='<h1>'+esc(c.title)+'</h1><div class="draftbox">This chapter has not been written yet.</div>'; }
    else { html=marked.parse(c.md); }
    html=fixLinks(html).replace(/<table>/g,'<div class="tbl"><table>').replace(/<\/table>/g,'</table></div>');
    if(c){
      var i=b.chapters.indexOf(c), prev=b.chapters[i-1], next=b.chapters[i+1];
      html+='<div class="pager"><span>'+(prev?'<a href="#'+hashFor(b.slug,prev.id)+'"><small>Previous</small>'+esc(prev.title)+'</a>':'')+'</span><span>'+(next?'<a href="#'+hashFor(b.slug,next.id)+'"><small>Next</small>'+esc(next.title)+'</a>':'')+'</span></div>';
    }
    doc.innerHTML=html;
    callouts(doc); diagrams(doc);
    doc.querySelectorAll('pre code').forEach(function(el){try{hljs.highlightElement(el)}catch(e){}});
    document.title=(c?c.title+' - ':'')+b.title+' - Study Notes';
    document.getElementById('main').scrollTop=0;
    buildToc();
    setMenu(false);
  });
}
var ALERT={note:'📘 Note',tip:'💡 Tip',important:'🏭 In production',warning:'⚠️ Pitfall',caution:'🔒 Security'};
function callouts(root){
  root.querySelectorAll('blockquote').forEach(function(bq){
    var p=bq.querySelector('p'); if(!p) return;
    var m=p.innerHTML.match(/^\s*\[!(NOTE|TIP|IMPORTANT|WARNING|CAUTION)\]\s*(<br>)?\s*/i); if(!m) return;
    var k=m[1].toLowerCase(); p.innerHTML=p.innerHTML.slice(m[0].length);
    var title=ALERT[k], first=p.firstElementChild;
    if(first&&first.tagName==='STRONG'&&p.innerHTML.indexOf('<strong>')===0){title=first.innerHTML; first.remove(); p.innerHTML=p.innerHTML.replace(/^\s*(<br>)?\s*/,'');}
    if(!p.textContent.trim()&&!p.querySelector('*')) p.remove();
    var d=document.createElement('div'); d.className='callout '+k;
    d.innerHTML='<p class="ctitle">'+title+'</p>'; while(bq.firstChild) d.appendChild(bq.firstChild);
    bq.parentNode.replaceChild(d,bq);
  });
}
var mermaidReady=false;
function diagrams(root){
  var els=root.querySelectorAll('pre code.language-mermaid'); if(!els.length||!window.mermaid) return;
  els.forEach(function(c){var d=document.createElement('div');d.className='mermaid';d.textContent=c.textContent;c.parentNode.parentNode.replaceChild(d,c.parentNode);});
  try{var dk=isDark();mermaid.initialize({startOnLoad:false,theme:'base',securityLevel:'strict',fontFamily:'Inter, system-ui, sans-serif',themeVariables:dk?{primaryColor:'#16303a',primaryTextColor:'#e4e9ef',primaryBorderColor:'#5cc0de',lineColor:'#9aa6b4',secondaryColor:'#221a35',tertiaryColor:'#161c24',clusterBkg:'#1b232d',clusterBorder:'#5cc0de',actorBkg:'#16303a',actorBorder:'#5cc0de',actorTextColor:'#e4e9ef',noteBkgColor:'#2c2111',noteTextColor:'#e4e9ef',signalColor:'#e4e9ef',signalTextColor:'#e4e9ef',edgeLabelBackground:'#161c24'}:{primaryColor:'#e1f1f6',primaryTextColor:'#1c2430',primaryBorderColor:'#0b6b8a',lineColor:'#5d6877',secondaryColor:'#f4efff',tertiaryColor:'#ffffff',clusterBkg:'#f7fbfc',clusterBorder:'#0b6b8a',actorBkg:'#e1f1f6',actorBorder:'#0b6b8a',noteBkgColor:'#fff6e6',edgeLabelBackground:'#ffffff'}});mermaid.run({nodes:root.querySelectorAll('.mermaid')});}catch(e){}
}
function buildToc(){
  var hs=document.querySelectorAll('#doc h2, #doc h3'), out='<p class="nav-title">On this page</p><ul>';
  hs.forEach(function(h,i){h.id='s'+i; out+='<li><a href="#s'+i+'" data-t="s'+i+'" class="'+h.tagName.toLowerCase()+'">'+esc(h.textContent)+'</a></li>';});
  out+='</ul>';
  document.getElementById('right').innerHTML=hs.length?out:'';
  if(hs.length){var m=document.createElement('details');m.className='mtoc';m.innerHTML='<summary>On this page</summary>'+out.replace('<p class="nav-title">On this page</p>','');var d=document.getElementById('doc');var h1=d.querySelector('h1');if(h1&&h1.nextSibling){h1.parentNode.insertBefore(m,h1.nextSibling)}else{d.insertBefore(m,d.firstChild)}}
}
document.addEventListener('click',function(e){
  var t=e.target.closest('[data-book]');
  if(t){var b=bookOf(t.getAttribute('data-book')); location.hash=b.slug; return;}
  var a=e.target.closest('aside.right a, .mtoc a');
  if(a){e.preventDefault(); var el=document.getElementById(a.getAttribute('data-t')); if(el)el.scrollIntoView({behavior:'smooth',block:'start'});}
});
document.getElementById('main').addEventListener('scroll',function(){
  var hs=document.querySelectorAll('#doc h2, #doc h3'), cur=null, top=document.getElementById('main').getBoundingClientRect().top;
  hs.forEach(function(h){if(h.getBoundingClientRect().top-top<90)cur=h.id;});
  document.querySelectorAll('aside.right a').forEach(function(a){a.classList.toggle('on',a.getAttribute('data-t')===cur)});
});
window.addEventListener('hashchange',function(){ if(/^#s\d+$/.test(location.hash))return; show(); });
function setMenu(open){var m=document.getElementById('chmenu');m.hidden=!open;document.getElementById('chbtn').setAttribute('aria-expanded',open)}
document.getElementById('chbtn').addEventListener('click',function(e){e.stopPropagation();setMenu(document.getElementById('chmenu').hidden)});
document.addEventListener('click',function(e){var m=document.getElementById('chmenu');if(!m.hidden&&!e.target.closest('#chmenu'))setMenu(false)});
document.addEventListener('keydown',function(e){if(e.key==='Escape')setMenu(false)});
function isDark(){return root.getAttribute('data-theme')==='dark'||(!root.getAttribute('data-theme')&&matchMedia('(prefers-color-scheme: dark)').matches)}
function setTheme(t){ if(t){root.setAttribute('data-theme',t)} document.getElementById('theme').textContent=isDark()?'Light':'Dark'; }
document.getElementById('theme').addEventListener('click',function(){
  var next=isDark()?'light':'dark'; setTheme(next); if(document.querySelector('#doc .mermaid')) show();
  try{localStorage.setItem('notes-theme',next)}catch(e){}
});
try{var saved=localStorage.getItem('notes-theme'); if(saved)root.setAttribute('data-theme',saved)}catch(e){}
setTheme();
show();
</script>
</body>
</html>
